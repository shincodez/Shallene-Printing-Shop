<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <!--
    TEMPORARY PLACEHOLDER — not a photo of the shop.
    To replace: add a real photo of the shop interior or counter
    (e.g. assets/images/shop/shop-interior.jpg) and change the
    <img src="..."> in the About section of index.html.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaedff"/>
      <stop offset="1" stop-color="#f7f8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dae2fd" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#grid)" opacity="0.6"/>

  <!-- Fanned sheets in the brand's cyan and magenta, with a "photo" icon -->
  <g transform="translate(600 210)">
    <rect x="-70" y="-85" width="140" height="170" rx="8" fill="#00aeef" opacity="0.18" transform="rotate(-14)"/>
    <rect x="-70" y="-85" width="140" height="170" rx="8" fill="#ec008c" opacity="0.16" transform="rotate(-4)"/>
    <rect x="-70" y="-85" width="140" height="170" rx="8" fill="#ffffff" stroke="#bfc7d2" stroke-width="2" transform="rotate(6)"/>
    <g transform="rotate(6)" fill="none" stroke="#006194" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-40" y="-32" width="80" height="64" rx="7"/>
      <circle cx="-14" cy="-10" r="8"/>
      <path d="M-40 24l26-24 19 18 13-11 22 17"/>
    </g>
    <circle cx="55" cy="-74" r="11" fill="#f7be1d" opacity="0.8"/>
  </g>

  <text x="600" y="380" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#131b2e">Shop interior photo coming soon</text>
  <text x="600" y="422" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#707881">Placeholder image — not an actual photo</text>
</svg>
