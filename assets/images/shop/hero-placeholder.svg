<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    TEMPORARY PLACEHOLDER — not a photo of the shop.
    To replace: add a real photo (e.g. assets/images/shop/shop-front.jpg)
    and change the <img src="..."> in the hero section of index.html.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaedff"/>
      <stop offset="1" stop-color="#f7f8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dae2fd" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.6"/>

  <!-- Three fanned "sheets" in the brand's cyan, magenta and yellow -->
  <!-- Text sits near the top so captions laid over the bottom of the
       image (on phones) never cover it. -->
  <text x="600" y="210" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" fill="#131b2e">Shop photo coming soon</text>
  <text x="600" y="256" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#707881">Placeholder image — not an actual photo</text>

  <g transform="translate(600 480)">
    <rect x="-90" y="-110" width="180" height="220" rx="10" fill="#00aeef" opacity="0.18" transform="rotate(-14)"/>
    <rect x="-90" y="-110" width="180" height="220" rx="10" fill="#ec008c" opacity="0.16" transform="rotate(-4)"/>
    <rect x="-90" y="-110" width="180" height="220" rx="10" fill="#ffffff" stroke="#bfc7d2" stroke-width="2" transform="rotate(6)"/>

    <!-- Simple "photo" icon on the front sheet -->
    <g transform="rotate(6)" fill="none" stroke="#006194" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-50" y="-40" width="100" height="80" rx="8"/>
      <circle cx="-18" cy="-12" r="10"/>
      <path d="M-50 30l32-30 24 22 16-14 28 22"/>
    </g>
    <circle cx="70" cy="-95" r="14" fill="#f7be1d" opacity="0.8"/>
  </g>
</svg>
